<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>taal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>taal</h1>
  <p class="sub">one track, every speaker in the room</p>

  <div class="choice">
    <a class="card" href="/host">
      <span class="card-title">host the room</span>
      <span class="card-note">pick the music, control the mix</span>
    </a>
    <a class="card accent" href="/join">
      <span class="card-title">join as a speaker</span>
      <span class="card-note">this device plays along</span>
    </a>
  </div>

  <p class="tip">everything stays on this network. nothing is uploaded anywhere.</p>
</main>
</body>
</html>
